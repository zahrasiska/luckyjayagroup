error_log /home/luckyjayagroup/ltech/logs/nginx-error.log;
pid /home/luckyjayagroup/ltech/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /home/luckyjayagroup/ltech/logs/nginx-access.log;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Increase body limits for large AI prompts
    client_body_temp_path /home/luckyjayagroup/ltech/logs/nginx_body;
    client_body_buffer_size 1M;
    client_max_body_size 10M;
    
    server {
        listen 8085;
        server_name localhost;

        # API Documentation
        location /docs {
            proxy_pass http://localhost:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            add_header Cross-Origin-Opener-Policy "unsafe-none" always;
            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        }
        
        # Notification Stream (Server-Sent Events - SSE)
        location /api/notifications/stream {
            proxy_pass http://localhost:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # SSE specific settings
            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 86400;  # 24 hours for long-lived connections
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            
            # Prevent buffering that could interfere with SSE
            proxy_redirect off;
            chunked_transfer_encoding on;
        }
        
        # Backend API (excluding notifications stream which has special handling)
        location /api {
            proxy_pass http://localhost:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
            
            # Increase timeouts for AI analysis
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            add_header Cross-Origin-Opener-Policy "unsafe-none" always;
            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        }
        
        # AI Multi-Agent Chat
        location /ai-chat/ {
            proxy_pass http://localhost:7002/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Increase timeouts for AI
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            add_header Cross-Origin-Opener-Policy "unsafe-none" always;
            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        }

        # Kasir POS Application
        location /kasir {
            alias /home/luckyjayagroup/ltech/kasir/dist;
            try_files $uri $uri/ /kasir/index.html;
            
            # Allow cross-origin opener policy for window.postMessage compatibility
            add_header Cross-Origin-Opener-Policy "unsafe-none" always;
            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        }
        
        # Main UI Application
        location / {
            root /home/luckyjayagroup/ltech/ui/dist;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
            
            # Allow cross-origin opener policy for window.postMessage compatibility
            add_header Cross-Origin-Opener-Policy "unsafe-none" always;
            add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
            
            # Additional security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
    }
}
